name: Feature request
description: An idea that would make Noctenna more useful.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or the trade, and where Noctenna gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Wallet
        - Swaps
        - New launches and launch checks
        - Perps (Arcus, Lighter)
        - Reopen watch
        - Funding radar
        - Bridge
        - Terminal agent or MCP
        - Website
        - Something else
